<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BayPAT Erfindungscheck Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/design-templates/step-wizard/step-wizard.css">
  <style>
    .landing-tiles { display: grid; gap: var(--space-24); margin-top: var(--space-24); }
    .landing-tile {
      padding: var(--space-24);
      border-radius: var(--wizard-radius);
      background: var(--wizard-card);
      box-shadow: var(--wizard-shadow);
      border: 1px solid var(--wizard-border);
      text-decoration: none;
      color: inherit;
      display: block;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .landing-tile:hover {
      box-shadow: 0 2px 8px rgba(7, 11, 42, 0.08);
      border-color: var(--wizard-accent-orange);
    }
    .landing-tile h2 { font-family: var(--wizard-font-headline); margin: 0 0 var(--space-8); font-size: var(--text-headline); font-weight: 400; color: var(--wizard-text); }
    .landing-tile p { margin: 0; color: var(--wizard-text-muted); font-size: var(--text-base); }
  </style>
</head>
<body>
  <div class="wizard-app">
    <div class="wizard-container">
      <header>
        <h1>BayPAT Erfindungscheck Workshop</h1>
        <p class="wizard-subtitle" style="margin: 0;">Guides für Erfindung, Patentierung und Erfindungsbeschreibung</p>
      </header>

      <div class="landing-tiles">
        <a href="v1-index.html" class="landing-tile">
          <h2>Erfindungscheck V1</h2>
          <p>Erste Übergabe vom 15.02.2026</p>
        </a>
        <a href="V2-HTML/index.html" class="landing-tile">
          <h2>Erfindungscheck V2</h2>
          <p>Änderungen vom 27.02.2026</p>
        </a>
        <a href="V3-HTML/index.html" class="landing-tile">
          <h2>Erfindungscheck V3</h2>
          <p>Änderungen vom 12.03.2026</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
